<!doctype html><html lang="en"><head><meta charset="utf-8"><style>@font-face{font-family:Inter;src:url("fonts/Inter-Bold.woff2");font-weight:700}
@font-face{font-family:Inter;src:url("fonts/Inter-Regular.woff2");font-weight:400}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:#f4f4ed}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#101a24}
.eyebrow{position:absolute;left:86px;top:67px;font-size:17px;letter-spacing:5px;color:#86f0d2;font-weight:700}
.edition{position:absolute;right:86px;top:67px;font-size:17px;letter-spacing:3px;color:#a3afba}
.rule{position:absolute;left:86px;top:110px;width:1108px;height:1px;background:#576a71}
.footer{position:absolute;left:86px;bottom:52px;font-size:16px;letter-spacing:3px;color:#a3afba}
.number{position:absolute;right:86px;bottom:45px;font-size:25px;letter-spacing:2px;color:#86f0d2}
@keyframes lift{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:translateY(0px)}}
@keyframes glide{from{opacity:0;transform:translateX(-85px)}to{opacity:1;transform:translateX(0px)}}
@keyframes grow{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:translateX(-32px)}to{transform:translateX(30px)}}
@keyframes stretch{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes float{from{transform:translateY(0px)}to{transform:translateY(-26px)}}

.stage{background:radial-gradient(circle at 85% 72%,#20545b 0%,#102431 44%,#0b151f 100%)}
.sun{position:absolute;left:837px;top:166px;width:340px;height:340px;border-radius:170px;background:radial-gradient(circle at 38% 35%,#fff4d3,#dfbd79 55%,#c97957 100%);box-shadow:0 0 100px #bd885b;animation:grow 1.4s .3s ease-out both,float 2s 1.5s ease-in-out infinite alternate}
.arc{position:absolute;left:785px;top:117px;width:440px;height:440px;border:2px solid #e9d29c;border-radius:220px;animation:grow 1.4s .7s ease-out both}
.line{position:absolute;left:86px;top:523px;width:520px;height:5px;background:#83e9c8;transform-origin:left center;animation:stretch 1s 1.4s ease-out both}
.label{position:absolute;left:89px;top:196px;font-size:25px;letter-spacing:5px;color:#becdd2;animation:glide .8s .1s ease-out both}
.title{position:absolute;left:81px;top:263px;font-size:130px;line-height:1.04;letter-spacing:-9px;font-weight:700;animation:lift 1.1s .4s ease-out both}
.title .accent{color:#8ff0cf}
.description{position:absolute;left:89px;top:559px;font-size:23px;color:#c2d2d0;animation:lift .8s 1.75s ease-out both}
</style></head><body><div class="stage"><div class="eyebrow">GENEVA / A MOTION STUDY</div><div class="edition">03 — 03</div><div class="rule"></div><div class="arc"></div><div class="sun"></div><div class="label">NOW MAKE IT</div><div class="title">MOVE<br><span class="accent">THE WORLD.</span></div><div class="line"></div><div class="description">Made with HTML, CSS and a Geneva timeline.</div><div class="footer">IDEA → FORM → POSSIBILITY</div><div class="number">03 / 03</div></div></body></html>
