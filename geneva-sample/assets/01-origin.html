<!doctype html><html lang="en"><head><meta charset="utf-8"><style>@font-face{font-family:Inter;src:url("fonts/Inter-Bold.woff2");font-weight:700}
@font-face{font-family:Inter;src:url("fonts/Inter-Regular.woff2");font-weight:400}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:#f4f4ed}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#101a24}
.eyebrow{position:absolute;left:86px;top:67px;font-size:17px;letter-spacing:5px;color:#86f0d2;font-weight:700}
.edition{position:absolute;right:86px;top:67px;font-size:17px;letter-spacing:3px;color:#a3afba}
.rule{position:absolute;left:86px;top:110px;width:1108px;height:1px;background:#576a71}
.footer{position:absolute;left:86px;bottom:52px;font-size:16px;letter-spacing:3px;color:#a3afba}
.number{position:absolute;right:86px;bottom:45px;font-size:25px;letter-spacing:2px;color:#86f0d2}
@keyframes lift{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:translateY(0px)}}
@keyframes glide{from{opacity:0;transform:translateX(-85px)}to{opacity:1;transform:translateX(0px)}}
@keyframes grow{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:translateX(-32px)}to{transform:translateX(30px)}}
@keyframes stretch{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes float{from{transform:translateY(0px)}to{transform:translateY(-26px)}}

.stage{background:radial-gradient(circle at 79% 48%,#24525a 0%,#101d2a 42%,#0c151f 100%)}
.halo{position:absolute;left:785px;top:172px;width:410px;height:410px;border:1px solid #81d7be;border-radius:205px;opacity:.65;animation:grow 1.6s .3s ease-out both}
.halo.two{left:845px;top:232px;width:290px;height:290px;border-radius:145px;opacity:.45;animation:grow 1.5s .65s ease-out both}
.orb{position:absolute;left:925px;top:316px;width:130px;height:130px;border-radius:65px;background:radial-gradient(circle at 30% 30%,#f9ffde,#8deed0 48%,#3ba8a9 100%);box-shadow:0 0 85px #72f5cc;animation:grow 1.4s 1s ease-out both,float 2s 2s ease-in-out infinite alternate}
.label{position:absolute;left:89px;top:196px;font-size:25px;letter-spacing:5px;color:#c2cdd0;animation:glide .8s .25s ease-out both}
.title{position:absolute;left:80px;top:252px;font-size:158px;line-height:1.04;font-weight:700;letter-spacing:-12px;animation:lift 1s .65s ease-out both}
.title .accent{color:#87edcb}
.description{position:absolute;left:89px;top:514px;font-size:24px;color:#bac8c8;animation:lift .8s 1.5s ease-out both}
</style></head><body><div class="stage"><div class="eyebrow">GENEVA / A MOTION STUDY</div><div class="edition">01 — 03</div><div class="rule"></div><div class="halo"></div><div class="halo two"></div><div class="orb"></div><div class="label">EVERYTHING BEGINS WITH</div><div class="title">ONE<br><span class="accent">SPARK.</span></div><div class="description">A small idea, ready to become something more.</div><div class="footer">IDEA → FORM → POSSIBILITY</div><div class="number">01 / 03</div></div></body></html>
