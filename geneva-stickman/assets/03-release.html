<!doctype html><html lang="en"><head><meta charset="utf-8"><style>@font-face{font-family:Inter;src:url("fonts/Inter-Bold.woff2");font-weight:700}@font-face{font-family:Inter;src:url("fonts/Inter-Regular.woff2");font-weight:400}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:#f4f6ec}.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#0b1824}

.caption{position:absolute;left:80px;bottom:56px;font-size:23px;color:#d5e2dd;animation:rise .8s 1.2s ease-out both}.counter{position:absolute;right:80px;bottom:55px;font-size:19px;letter-spacing:2px;color:#83e8ca}

.stage{background:radial-gradient(circle at 75% 56%,#285259,#0a1b28 62%)}.person{left:204px;top:304px;animation:walk 1s .1s ease-out both}
.sun{position:absolute;left:785px;top:230px;width:270px;height:270px;border-radius:135px;background:radial-gradient(circle at 35% 30%,#fff6d3,#e9bf7e 65%,#b8766d);box-shadow:0 0 85px #c18f76;animation:fade 1s .4s ease-out both,pulse 1.5s 1.5s ease-in-out infinite alternate}

</style></head><body><div class="stage"><div class="kicker">ONE SPARK / A STICKMAN STORY</div><div class="chapter">ACT 03 / 03</div><div class="rule"></div><div class="title">And lets it <b>fly.</b></div><div class="floor"></div><div class="person"><div class="head"></div><div class="torso"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div><div class="ring outer"></div><div class="ring"></div><div class="spark"></div><div class="box"></div><div class="box inside"></div><div class="dot"></div><div class="sun"></div><div class="orbit"></div><div class="star"></div><div class="caption">One spark. Infinite possibilities. Made with Geneva.</div><div class="counter">03 — 03</div></div></body></html>
