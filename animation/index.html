<!doctype html>

<div data-hf-id="hf-v67q" id="dot-path" data-composition-id="dot-path" data-start="0" data-duration="7" data-fps="30" data-width="1920" data-height="1080">

      <radialGradient data-hf-id="hf-ndko" id="end-glow"><stop data-hf-id="hf-lzib" offset="0" stop-color="#F8D8A8" stop-opacity=".25"/><stop data-hf-id="hf-i2e3" offset="1" stop-color="#F8D8A8" stop-opacity="0"/></radialGradient>

    <circle data-hf-id="hf-ywn9" id="destination-ring" cx="1760" cy="268" r="38" fill="none" stroke="#F6CF9B" stroke-width="3" opacity="0"/>

</div>
<script src="lib/gsap.min.js"></script>
<script>
  (() => {
    'use strict';
    const path=document.getElementById('trail');
    const dot=document.getElementById('dot');
    const shell=document.getElementById('dot-shell');
    const halo=document.getElementById('dot-halo');
    const length=path.getTotalLength();
    path.setAttribute('stroke-dasharray',`${length} ${length}`);
    const state={distance:0};
    function pose(){
      const distance=Math.max(0,Math.min(length,state.distance));
      const p=path.getPointAtLength(distance);
      path.setAttribute('stroke-dashoffset',String(length-distance));
      for(const el of [dot,shell,halo]){el.setAttribute('cx',p.x.toFixed(3));el.setAttribute('cy',p.y.toFixed(3))}
    }
    pose();
    // Registry pattern: offset-path-traveler + svg-stroke-trace, adapted to
    // a single SVG with no CSS or paid MotionPathPlugin. Pure absolute progress.
    const tl=gsap.timeline({paused:true});
    tl.fromTo(state,{distance:0},{distance:length,duration:4.55,ease:'power2.inOut',onUpdate:pose,immediateRender:false},.4);
    tl.fromTo('#origin-ring',{attr:{r:33,opacity:.45}},{attr:{r:57,opacity:0},duration:.7,ease:'power2.out',immediateRender:false},.4);
    tl.fromTo('#destination-glow',{attr:{opacity:0}},{attr:{opacity:1},duration:.75,ease:'power2.out',immediateRender:false},4.58);
    tl.fromTo('#destination-ring',{attr:{opacity:0,r:18}},{attr:{opacity:.9,r:48},duration:.75,ease:'back.out(1.3)',immediateRender:false},4.65);
    tl.fromTo('#dot-shell',{attr:{r:22,opacity:.25}},{attr:{r:38,opacity:.16},duration:.8,ease:'power2.out',immediateRender:false},4.95);
    tl.fromTo('#dot',{attr:{r:11,fill:'#F7FCED'}},{attr:{r:14,fill:'#F6CF9B'},duration:.65,ease:'power2.out',immediateRender:false},4.95);
    tl.to(state,{distance:length,duration:.01,onUpdate:pose},6.98);
    window.__timelines=window.__timelines||{};
    window.__timelines['dot-path']=tl;
  })();
</script>
