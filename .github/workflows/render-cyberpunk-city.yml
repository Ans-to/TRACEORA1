name: Render Neon Cyberpunk City (drone shot)

# Renders render/neon_cyberpunk_city.py with Blender on GitHub runners,
# encodes an H.264 MP4 and publishes it as a public release asset, so the
# download link works without a GitHub login.
#
# The shot is split across parallel shards (matrix jobs), which is the only
# way to get a 1080p path-traced animation done inside a sensible wall time.
#
# Start it from the Actions tab, or by editing render/ci-run.json and pushing.

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Frame range of the shot (e.g. 1-150); 24 frames = 1 second"
        default: "1-150"
        required: true
      resolution:
        description: "Resolution: WxH or 1080p / 720p / 540p"
        default: "1920x1080"
        required: true
      samples:
        description: "Samples per pixel (16-32 with denoising is plenty)"
        default: "20"
        required: true
      engine:
        description: "Render engine"
        type: choice
        options: [cycles, eevee]
        default: cycles
      shards:
        description: "Parallel runners (1-8); each renders an equal slice of frames"
        default: "6"
      percent:
        description: "Resolution percentage (100 = full)"
        default: "100"
      bloom:
        description: "Post bloom strength 0-1 (0 disables)"
        default: "0.5"
      profile:
        description: "Quality profile (atmospherics vs speed)"
        type: choice
        options: [thin_hero, thin, full, none]
        default: thin_hero
      tag:
        description: "Release tag (stable download URL)"
        default: "cyberpunk-city"
      upload_frames:
        description: "Upload raw PNG frames too (debugging, big)"
        type: choice
        options: ["false", "true"]
        default: "false"
      preview:
        description: "Commit small preview stills to render/preview/ for review"
        type: choice
        options: ["false", "true"]
        default: "false"
      variants:
        description: "Benchmark one frame across quality profiles instead of rendering"
        type: choice
        options: ["false", "true"]
        default: "false"
      render:
        description: "Set false to only build/validate the scene (no render)"
        type: choice
        options: ["true", "false"]
        default: "true"
  # The agent loop drives renders by editing render/ci-run.json and pushing.
  # Nothing else auto-triggers, so tweaking the scene never burns a 1h render
  # by accident. Use the Actions tab for real renders.
  push:
    branches: ["arena/**"]
    paths:
      - "render/ci-run.json"

permissions:
  contents: write

concurrency:
  group: cyberpunk-render
  cancel-in-progress: false

env:
  MP4: neon-cyberpunk-city-drone.mp4

jobs:
  # -------------------------------------------------------------------
  # 1. Resolve parameters (workflow inputs, or render/ci-run.json on push)
  # -------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.p.outputs.frames }}
      res: ${{ steps.p.outputs.res }}
      samples: ${{ steps.p.outputs.samples }}
      engine: ${{ steps.p.outputs.engine }}
      percent: ${{ steps.p.outputs.percent }}
      bloom: ${{ steps.p.outputs.bloom }}
      tag: ${{ steps.p.outputs.tag }}
      upload_frames: ${{ steps.p.outputs.upload_frames }}
      preview: ${{ steps.p.outputs.preview }}
      profile: ${{ steps.p.outputs.profile }}
      variants: ${{ steps.p.outputs.variants }}
      render: ${{ steps.p.outputs.render }}
      shards: ${{ steps.p.outputs.shards }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve parameters
        id: p
        env:
          IN_FRAMES: ${{ inputs.frames }}
          IN_RES: ${{ inputs.resolution }}
          IN_SAMPLES: ${{ inputs.samples }}
          IN_ENGINE: ${{ inputs.engine }}
          IN_PERCENT: ${{ inputs.percent }}
          IN_BLOOM: ${{ inputs.bloom }}
          IN_TAG: ${{ inputs.tag }}
          IN_UPLOAD: ${{ inputs.upload_frames }}
          IN_RENDER: ${{ inputs.render }}
          IN_PREVIEW: ${{ inputs.preview }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_VARIANTS: ${{ inputs.variants }}
          IN_SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          cfg=render/ci-run.json
          pick() { # $1 key, $2 workflow input, $3 default
            local key="$1" inp="$2" def="$3"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -f "$cfg" ]; then
              jq -r --arg k "$key" --arg d "$def" '(.[$k] // $d) | tostring' "$cfg"
            elif [ -n "$inp" ]; then
              echo "$inp"
            else
              echo "$def"
            fi
          }
          frames="$(pick frames        "$IN_FRAMES"  '1-150')"
          res="$(pick resolution      "$IN_RES"     '1920x1080')"
          samples="$(pick samples       "$IN_SAMPLES" '20')"
          engine="$(pick engine        "$IN_ENGINE"  'cycles')"
          percent="$(pick percent       "$IN_PERCENT" '100')"
          bloom="$(pick bloom         "$IN_BLOOM"   '0.5')"
          tag="$(pick tag           "$IN_TAG"     'cyberpunk-city')"
          upload="$(pick upload_frames "$IN_UPLOAD"  'false')"
          do_render="$(pick render        "$IN_RENDER"  'true')"
          preview="$(pick preview       "$IN_PREVIEW" 'false')"
          profile="$(pick profile       "$IN_PROFILE" 'thin_hero')"
          variants="$(pick variants      "$IN_VARIANTS" 'false')"
          shards="$(pick shards        "$IN_SHARDS"  '6')"

          case "$res" in
            1080p) res=1920x1080 ;;
            720p)  res=1280x720 ;;
            540p)  res=960x540 ;;
          esac
          printf '%s' "$frames" | grep -qE '^[0-9]+-[0-9]+$' || {
            echo "::error::frames must look like 1-150 (got '$frames')"; exit 1; }
          printf '%s' "$res" | grep -qE '^[0-9]+x[0-9]+$' || {
            echo "::error::resolution must look like 1920x1080 (got '$res')"; exit 1; }
          # benchmark / build-only runs never shard
          if [ "$variants" = "true" ] || [ "$do_render" != "true" ]; then shards=1; fi
          [ "$shards" -ge 1 ] 2>/dev/null || shards=1
          [ "$shards" -le 8 ] || shards=8
          matrix=$(python3 -c "import json,sys;print(json.dumps({'shard':list(range(int(sys.argv[1])))}))" "$shards")

          {
            echo "frames=$frames"
            echo "res=$res"
            echo "samples=$samples"
            echo "engine=$engine"
            echo "percent=$percent"
            echo "bloom=$bloom"
            echo "tag=$tag"
            echo "upload_frames=$upload"
            echo "render=$do_render"
            echo "preview=$preview"
            echo "profile=$profile"
            echo "variants=$variants"
            echo "shards=$shards"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "frames=$frames res=$res samples=$samples engine=$engine profile=$profile shards=$shards render=$do_render"
          {
            echo "### Render plan"
            echo "- frames: \`$frames\` @ $res, $samples samples, engine \`$engine\`, profile \`$profile\`"
            echo "- shards: $shards, bloom $bloom, release tag \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # 2. Render (one matrix job per shard)
  # -------------------------------------------------------------------
  render:
    name: Render shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: ~/blender-bin
          key: blender-linux-x64-4.5-v1

      - name: Install Blender
        run: |
          set -euo pipefail
          if [ -x "$HOME/blender-bin/blender" ]; then
            echo "Using cached Blender: $("$HOME/blender-bin/blender" --version | head -1)"
          else
            BASE=https://download.blender.org/release
            DIRS=$(curl -fsSL "$BASE/" | grep -oE 'Blender[45]\.[0-9]+/' | tr -d '/' | sort -uV)
            echo "Release branches found:"; echo "$DIRS"
            DIR=$(echo "$DIRS" | grep -x 'Blender4\.5' || echo "$DIRS" | tail -1)
            FILE=$(curl -fsSL "$BASE/$DIR/" \
                   | grep -oE 'blender-[0-9]+\.[0-9]+\.[0-9]+-linux-x64\.tar\.xz' \
                   | sort -uV | tail -1)
            echo "Downloading $BASE/$DIR/$FILE"
            curl -fL --retry 3 -o /tmp/blender.tar.xz "$BASE/$DIR/$FILE"
            mkdir -p "$HOME/blender-bin"
            tar -xJf /tmp/blender.tar.xz -C /tmp
            mv /tmp/blender-*-linux-x64/* "$HOME/blender-bin/"
            rm -f /tmp/blender.tar.xz
            echo "Installed: $("$HOME/blender-bin/blender" --version | head -1)"
          fi
          echo "$HOME/blender-bin" >> "$GITHUB_PATH"

      - name: Install software GL (EEVEE only)
        if: needs.plan.outputs.engine == 'eevee'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libglx-mesa0 \
            libxi6 libxxf86vm1 libxrender1 libxfixes3 libsm6 libxkbcommon0

      - name: Render shard ${{ matrix.shard }}
        id: render
        env:
          ENGINE: ${{ needs.plan.outputs.engine }}
          FRAMES: ${{ needs.plan.outputs.frames }}
          RES: ${{ needs.plan.outputs.res }}
          SAMPLES: ${{ needs.plan.outputs.samples }}
          PERCENT: ${{ needs.plan.outputs.percent }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          VARIANTS: ${{ needs.plan.outputs.variants }}
          DO_RENDER: ${{ needs.plan.outputs.render }}
          SHARD: ${{ matrix.shard }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euxo pipefail
          rm -rf frames && mkdir -p frames
          START="${FRAMES%-*}"; END="${FRAMES#*-}"
          TOTAL=$(( END - START + 1 ))
          SHARDS=$(printf '%s' "$MATRIX" | python3 -c "import json,sys;print(len(json.load(sys.stdin)['shard']))")
          BASE=$(( TOTAL / SHARDS )); EXTRA=$(( TOTAL % SHARDS ))
          if [ "$SHARD" -lt "$EXTRA" ]; then
            COUNT=$(( BASE + 1 )); OFFSET=$(( SHARD * (BASE + 1) ))
          else
            COUNT=$BASE; OFFSET=$(( EXTRA * (BASE + 1) + (SHARD - EXTRA) * BASE ))
          fi
          if [ "$COUNT" -le 0 ]; then echo "shard $SHARD has no frames; nothing to do"; exit 0; fi
          S=$(( START + OFFSET )); E=$(( S + COUNT - 1 ))
          echo "shard $SHARD/$SHARDS renders frames $S-$E ($COUNT of $TOTAL), shot $START-$END"

          extra=()
          if [ "$VARIANTS" = "true" ]; then
            extra+=(--variants)
          elif [ "$DO_RENDER" = "true" ]; then
            extra+=(--render)
          else
            echo "build-only validation run (render=false)"
          fi
          common=(--engine "$ENGINE" --res "$RES" --samples "$SAMPLES"
                  --percent "$PERCENT" --frames "$S-$E" --shot "$START-$END"
                  --out frames --profile "$PROFILE")

          echo "== Blender =="; blender --version | head -2
          run_blender() {   # $1 = "eevee" to go through xvfb
            if [ "${1:-}" = "eevee" ]; then
              export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
              xvfb-run -a -s "-screen 0 1920x1080x24" \
                blender -b --factory-startup --python render/neon_cyberpunk_city.py -- \
                "${extra[@]}" "${common[@]}" 2>&1 | tee blender.log
            else
              blender -b --factory-startup --python render/neon_cyberpunk_city.py -- \
                "${extra[@]}" "${common[@]}" 2>&1 | tee blender.log
            fi
            return "${PIPESTATUS[0]}"
          }
          set +e
          if [ "$ENGINE" = "eevee" ]; then
            run_blender eevee; rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning title=EEVEE failed::Falling back to Cycles"
              extra+=(--render); common=(--engine cycles --res "$RES" --samples "$SAMPLES" \
                --percent "$PERCENT" --frames "$S-$E" --shot "$START-$END" --out frames \
                --profile "$PROFILE")
              run_blender; rc=$?
            fi
          else
            run_blender; rc=$?
          fi
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Blender exit $rc::$(grep -iE 'error|traceback|exception|line [0-9]+' blender.log | tail -6 | tr '\n' ' | ')"
            grep -iE 'error|traceback|exception|file \"' blender.log | tail -12 | \
              while IFS= read -r l; do echo "::error::$l"; done || true
            exit "$rc"
          fi

          grep -E '^\[(scene|render|stats|variant)\]' blender.log | tail -40 | \
            while IFS= read -r line; do echo "::notice::$line"; done || true
          grep -E '^\[(scene|stats|render|variant)\]' blender.log \
            >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          count=$(find frames -name '*.png' 2>/dev/null | wc -l || true)
          echo "shard produced $count images"
          if [ "$DO_RENDER" = "true" ] || [ "$VARIANTS" = "true" ]; then
            du -sh frames
            [ "$count" -gt 0 ] || { echo "::error::shard $SHARD rendered nothing"; exit 1; }
          else
            echo "build-only run: scene validated, nothing to render"
          fi

      - name: Publish shard log on failure (shard 0)
        if: always() && matrix.shard == 0 && steps.render.outcome != 'success'
        run: |
          set -uo pipefail
          [ -f blender.log ] || { echo "no blender.log"; exit 0; }
          mkdir -p render/preview
          cp blender.log render/preview/blender.log
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add render/preview/blender.log || exit 0
          git commit -m "ci: blender log from run ${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push log"

      - name: Upload shard frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: frames/*.png
          retention-days: 7
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # 3. Encode + publish
  # -------------------------------------------------------------------
  finalize:
    name: Encode + publish
    needs: [plan, render]
    if: always() && needs.plan.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Download rendered frames
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: frames

      - name: Collect + verify frames
        id: verify
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(frames/*.png)
          COUNT=${#files[@]}
          START="${{ needs.plan.outputs.frames }}"; START="${START%-*}"
          TOTAL="${{ needs.plan.outputs.frames }}"
          TOTAL=$(( ${TOTAL#*-} - ${TOTAL%-*} + 1 ))
          echo "found $COUNT frames, shot needs $TOTAL"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -lt "$TOTAL" ]; then
            echo "::warning::only $COUNT/$TOTAL frames arrived (a shard likely failed)"
          fi

      - name: Publish preview stills (review)
        if: always() && needs.plan.outputs.preview == 'true'
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(frames/*.png)
          mkdir -p render/preview
          rm -f render/preview/*.jpg
          if [ ${#files[@]} -gt 0 ]; then
            pick=("${files[0]}")
            if [ ${#files[@]} -gt 2 ]; then pick+=("${files[${#files[@]}/2]}"); fi
            if [ ${#files[@]} -gt 1 ]; then pick+=("${files[${#files[@]}-1]}"); fi
            for f in "${pick[@]}"; do
              base=$(basename "$f" .png)
              ffmpeg -hide_banner -loglevel error -y -i "$f" -vf "scale=1000:-1" \
                -q:v 4 "render/preview/${base}.jpg" || echo "encode failed for $f"
            done
          else
            echo "no frames to preview"
          fi
          ls -la render/preview || true
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add render/preview || exit 0
          git commit -m "ci: preview stills from run ${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push preview stills"

      - name: Encode MP4 (bloom + grade)
        if: needs.render.result == 'success' && needs.plan.outputs.variants != 'true'
        env:
          BLOOM: ${{ needs.plan.outputs.bloom }}
        run: |
          set -euo pipefail
          START="${{ steps.verify.outputs.start }}"
          COUNT="${{ steps.verify.outputs.count }}"
          TOTAL="${{ steps.verify.outputs.total }}"
          [ "$COUNT" -gt 0 ] || { echo "::error::nothing to encode"; exit 1; }
          [ "$COUNT" -ge "$TOTAL" ] || { echo "::error::$COUNT/$TOTAL frames, refusing to publish a truncated video"; exit 1; }

          grade="eq=contrast=1.07:saturation=1.16,vignette=angle=PI/4.5"
          if awk "BEGIN{exit !($BLOOM > 0)}"; then
            fc="[0:v]split=2[base][bl];[bl]gblur=sigma=22:steps=3,colorlevels=rimin=0.55:gimin=0.55:bimin=0.55[glow];[base][glow]blend=all_mode=screen:all_opacity=${BLOOM}[mix];[mix]${grade}[v]"
          else
            fc="[0:v]${grade}[v]"
          fi
          echo "filtergraph: $fc"

          ffmpeg -hide_banner -y -framerate 24 -start_number "$START" \
            -i frames/frame_%04d.png -filter_complex "$fc" -map "[v]" \
            -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p \
            -movflags +faststart -g 48 "$MP4"

          ffmpeg -hide_banner -y -ss 2 -i "$MP4" -frames:v 1 -q:v 2 poster.jpg || true
          ffprobe -hide_banner -v error -show_entries \
            format=duration,size:stream=width,height,nb_frames \
            -of default=noprint_wrappers=1 "$MP4"

      - name: Upload MP4 artifact
        if: always() && hashFiles('neon-cyberpunk-city-drone.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: neon-cyberpunk-city-mp4
          path: |
            neon-cyberpunk-city-drone.mp4
            poster.jpg
          retention-days: 30

      - name: Upload raw frames (optional)
        if: always() && needs.plan.outputs.upload_frames == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neon-cyberpunk-city-frames
          path: frames/*.png
          retention-days: 7

      - name: Publish release asset (public download link)
        if: success() && hashFiles('neon-cyberpunk-city-drone.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          FRAMES: ${{ needs.plan.outputs.frames }}
          RES: ${{ needs.plan.outputs.res }}
          ENGINE: ${{ needs.plan.outputs.engine }}
          SAMPLES: ${{ needs.plan.outputs.samples }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Neon Cyberpunk City — drone render" \
              --notes "Procedural Blender scene: a car parked on a rooftop, a man sitting on the car, and a slow drone flyby through a neon skyline. Rendered headlessly in GitHub Actions (frames $FRAMES @ $RES, $ENGINE, $SAMPLES samples)."
          gh release upload "$TAG" "$MP4" --clobber
          gh release upload "$TAG" poster.jpg --clobber || true

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MP4}"
          {
            echo "## Neon Cyberpunk City — render finished"
            echo ""
            echo "**Download (MP4, direct, no login):** $URL"
            echo ""
            echo "| frames | resolution | engine | samples | shards |"
            echo "|---|---|---|---|---|"
            echo "| $FRAMES | $RES | $ENGINE | $SAMPLES | ${{ needs.plan.outputs.shards }} |"
            echo ""
            echo "Artifact: \`neon-cyberpunk-city-mp4\` on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $URL"
